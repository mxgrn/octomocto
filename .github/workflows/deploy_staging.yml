name: Staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: Deploy
    strategy:
      matrix:
        app: [octomocto]
        env: [staging]
        os: [ubuntu-latest]
        port: [8111]
        username: [deploy]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/mxgrn/${{matrix.app}}_${{matrix.env}}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # One host at a time (sync), so that the other node keeps the Schulte
      # games. A new node gets the games from the other node before its
      # health check passes.
      # No Telegram login on staging: the bot has the domain of prod.
      - name: Pull image on hosts, restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          # "app2,app1"
          host: "49.12.187.176,5.75.226.35"
          username: ${{matrix.username}}
          key: ${{ secrets.DEPLOYMENT_KEY }}
          script_stop: true
          sync: true
          script: |
            echo "${{secrets.GITHUB_TOKEN}}" | docker login https://ghcr.io -u ${{github.actor}} --password-stdin
            docker pull ghcr.io/mxgrn/${{matrix.app}}_${{matrix.env}}
            # Run the migrations before the new version starts. If they fail, the old version keeps running.
            docker run --rm \
              -e SECRET_KEY_BASE=${{secrets.SECRET_KEY_BASE_STAGING}} \
              -e DATABASE_URL=${{secrets.DATABASE_URL_STAGING}} \
              ghcr.io/mxgrn/${{matrix.app}}_${{matrix.env}} /app/bin/migrate
            docker stop ${{matrix.app}}_${{matrix.env}} || true
            docker rm ${{matrix.app}}_${{matrix.env}} || true
            docker run --name=${{matrix.app}}_${{matrix.env}} -d \
              --restart always \
              --network host \
              -e PORT=${{matrix.port}} \
              -e RELEASE_COOKIE=${{secrets.RELEASE_COOKIE_STAGING}} \
              -e PROD_ENV=${{matrix.env}} \
              -e PHX_SERVER=true \
              -e SECRET_KEY_BASE=${{secrets.SECRET_KEY_BASE_STAGING}} \
              -e DATABASE_URL=${{secrets.DATABASE_URL_STAGING}} \
              -e GITHUB_SHA=${{github.sha}} \
              -e PHX_HOST=staging.octomocto.com \
              -e RESEND_API_KEY=${{secrets.RESEND_API_KEY}} \
              ghcr.io/mxgrn/${{matrix.app}}_${{matrix.env}}
            for i in {1..60}; do curl localhost:${{matrix.port}}/health && break || { [ $i -eq 60 ] && echo "Failed after 60 attempts" && exit 1 || sleep 1; }; done
